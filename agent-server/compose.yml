
name: agent-server

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - agent-backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  trading-journal-migrate:
    image: ghcr.io/amacneil/dbmate:2
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./applications/trading-journal/.env
    volumes:
      - ./applications/trading-journal/db/migrations:/db/migrations
    networks:
      - agent-backend

volumes:
  postgres_data:

networks:
  agent-backend:
